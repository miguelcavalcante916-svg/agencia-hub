<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 104 124" role="img" aria-label="Cavalcante">
  <g fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- arco externo: o "C" de Cavalcante, que também é a crina -->
    <path d="M62 12C40 12 24 30 22 54c-2 22-2 36 6 48"/>
    <!-- cabeça: testa descendo até o focinho -->
    <path d="M58 21c9 1 14 6 18 13 3 6 9 10 9 17 0 8-6 13-13 14"/>
    <!-- maçã do rosto / queixo -->
    <path d="M48 42c5-7 11-10 18-9"/>
    <!-- pescoço e peito -->
    <path d="M74 65c-9-2-17 1-23 7-6 6-9 14-9 24"/>
  </g>
  <!-- base em dois níveis -->
  <g fill="currentColor">
    <path d="M34 96h30a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H34a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3z"/>
    <path d="M26 112h54a4 4 0 0 1 4 4v5H22v-5a4 4 0 0 1 4-4z"/>
  </g>
</svg>
