<title>Portal do Cliente — Agência Cavalcante</title>

<style>
:root {
  --marinho-900: #060C1C; --marinho-800: #0A1730; --marinho-700: #16255F;
  --grafite-900: #08090E; --borda: rgba(255,255,255,.10);
  --tinta: #fff; --tinta-2: rgba(255,255,255,.72); --tinta-3: rgba(255,255,255,.60);
  --azul: #4361ee; --azul-claro: #8ea6ff;
  --t-rapido: 180ms; --t-base: 320ms; --t-lento: 560ms;
  --e-sai: cubic-bezier(.22,.61,.36,1);
  --fonte-titulo: "Urbanist", ui-sans-serif, system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--marinho-900); color: var(--tinta); min-height: 100dvh;
  font: 15px/1.6 "Lexend", ui-sans-serif, system-ui, sans-serif;
  display: grid; place-items: center; padding: 24px;
  -webkit-font-smoothing: antialiased;
}
/* a grade fina do tabuleiro, igual à do site */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size: 88px 88px;
  -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 75%);
          mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, #000 30%, transparent 75%);
}
.caixa {
  position: relative; z-index: 1; width: 100%; max-width: 460px;
  background: var(--grafite-900); border: 1px solid var(--borda);
  border-radius: 16px; padding: 38px 32px 30px; text-align: center;
  animation: entrar var(--t-lento) var(--e-sai) backwards;
}
/* a régua-assinatura */
.caixa::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 1px;
  background: linear-gradient(90deg, var(--azul-claro), rgba(142,166,255,0));
  transform: scaleX(0); transform-origin: left;
  animation: desenhar 720ms var(--e-sai) 180ms forwards;
}
@keyframes entrar { from { opacity: 0; transform: translateY(14px); } }
@keyframes desenhar { to { transform: scaleX(1); } }

.marca { display: inline-flex; align-items: center; gap: 10px; margin-bottom: 22px; }
.marca svg { height: 34px; color: var(--tinta); }
.marca b { font-family: var(--fonte-titulo); font-size: 15px; font-weight: 800; letter-spacing: -.01em; }
.marca span { color: var(--azul-claro); }

h1 { font-family: var(--fonte-titulo); font-size: 26px; font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
.sub { color: var(--tinta-2); margin-top: 10px; font-size: 14.5px; }

form { margin-top: 24px; text-align: left; }
label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--azul-claro); font-family: var(--fonte-titulo); font-weight: 800; margin-bottom: 8px; }
input {
  width: 100%; background: var(--marinho-900); color: var(--tinta);
  border: 1px solid var(--borda); border-radius: 10px; padding: 13px 14px;
  font: 400 14px/1.4 "Lexend", ui-sans-serif, system-ui, sans-serif;
  transition: border-color var(--t-rapido) ease;
}
input:focus { outline: 2px solid var(--azul-claro); outline-offset: 2px; border-color: transparent; }
input::placeholder { color: rgba(255,255,255,.35); }

.btn {
  width: 100%; margin-top: 14px; border: 0; cursor: pointer;
  background: var(--azul); color: #fff; border-radius: 11px; padding: 14px 20px;
  font: 600 15px "Lexend", ui-sans-serif, system-ui, sans-serif;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: background var(--t-rapido) ease, transform var(--t-rapido) var(--e-sai);
}
.btn:hover { background: #5878ff; }
.btn:active { transform: scale(.985); transition-duration: 90ms; }
.btn:focus-visible { outline: 2px solid var(--azul-claro); outline-offset: 3px; }

.erro {
  margin-top: 12px; font-size: 13.5px; color: #ffb4b4;
  background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.35);
  border-radius: 9px; padding: 10px 12px;
}
.ajuda { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--borda); font-size: 13.5px; color: var(--tinta-3); }
.ajuda a { color: var(--azul-claro); }
.rodape { position: relative; z-index: 1; margin-top: 18px; font-size: 12.5px; color: rgba(255,255,255,.4); text-align: center; }
.rodape a { color: rgba(255,255,255,.55); }

@media (prefers-reduced-motion: reduce) {
  *, *::before { animation-duration: 1ms !important; transition-duration: 1ms !important; }
  .caixa::before { transform: scaleX(1); }
}
</style>
</head>
<body>

<div>
<div class="caixa">
  <div class="marca">

-46.8,89.3-2,183.9,6.7,205.5 c13.9,34.6,36.4,63.5,68.9,82.9c23.7,14.2,49,19.6,77.8,8.3c-1.6-6.6-5.2-18.1-14.6-29.1c-5.4-6.3-11-10.6-15.4-13.4 c-10.2-1.9-26.2-6.4-42-17.8c-20.1-14.5-29-32.6-39.3-53.6c-13.7-27.7-18.6-51.6-20.4-61.9c-5.3-30.8-3.2-57.2,0-75.8 c18.1,44.1,42.9,55.3,52.2,58.6c25.9,9.1,65.1,5.1,81.4,0.7c30.4-8.3,55.6,2.3,77.4,22.9c9.9,9.4,19,19.7,27.5,28.7 C737.3,543,765.2,510.3,755,454.8z"/></svg>
    <b>Agência <span>Cavalcante</span></b>
  </div>

  <h1>Portal do Cliente</h1>
  <p class="sub">Cole aqui o link de acesso que você recebeu no WhatsApp. Depois disso este aparelho já entra direto.</p>

  <form id="form-entrar">
    <label for="campo-link">Seu link de acesso</label>
    <input id="campo-link" type="text" inputmode="url" autocomplete="off" spellcheck="false"
           placeholder="https://agenciacavalcante.com/app/#/p?d=..." required>
    <button class="btn" type="submit">
      Entrar no meu portal
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
    </button>
    <div class="erro" id="erro" hidden></div>
  </form>

  <p class="ajuda">
    Não encontrou o link? Ele foi enviado no seu WhatsApp pela agência.
    <a href="https://wa.me/5584999492725?text=Ol%C3%A1%21%20Perdi%20o%20link%20do%20meu%20portal%2C%20pode%20reenviar%3F">Peça o reenvio aqui</a>.
  </p>
</div>

<p class="rodape">
  <a href="../">Voltar ao site</a>
</p>
</div>

<script>
(function () {
  'use strict';
  var CHAVE = 'cavalcante:portal:link';
  var form = document.getElementById('form-entrar');
  var campo = document.getElementById('campo-link');
  var erro = document.getElementById('erro');

  function mostrarErro(msg) {
    erro.textContent = msg;
    erro.hidden = false;
  }

  /* Extrai só a parte que importa do que foi colado: o cliente pode colar a
     URL inteira, ou só o pedaço #/p?d=... — os dois têm que funcionar. */
  function extrair(texto) {
    var t = String(texto || '').trim();
    var m = t.match(/#\/p\?d=([A-Za-z0-9._~%-]+)/);
    return m ? m[1] : null;
  }

  function entrar(payload, guardar) {
    if (guardar) {
      try { localStorage.setItem(CHAVE, payload); } catch (e) { /* aba anônima: entra mesmo assim */ }
    }
    location.replace('../app/index.html#/p?d=' + payload);
  }

  /* Já entrou neste aparelho antes? Vai direto, sem pedir nada de novo. */
  var salvo = null;
  try { salvo = localStorage.getItem(CHAVE); } catch (e) { /* storage bloqueado */ }
  if (salvo) { entrar(salvo, false); }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    erro.hidden = true;
    var payload = extrair(campo.value);
    if (!payload) {
      mostrarErro('Esse link não parece o do portal. Ele tem "#/p?d=" no meio — cole o endereço inteiro que a agência enviou.');
      campo.focus();
      return;
    }
    entrar(payload, true);
  });
})();
</script>
