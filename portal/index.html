<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Portal do Cliente — Agência Cavalcante</title>
<meta name="description" content="Entrada do Portal do Cliente da Agência Cavalcante.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#060C1C">
<link rel="icon" href="../favicon.svg?v=3" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@700;800&family=Lexend:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@700;800&family=Lexend:wght@400;500;600&display=swap"></noscript>
<style>
/* Mesmos tokens do site, para a entrada do portal não parecer outra marca */
:root {
  --marinho-900: #060C1C; --marinho-800: #0A1730; --marinho-700: #16255F;
  --grafite-900: #08090E; --grafite-800: #101219;
  --borda: rgba(255,255,255,.10);
  --tinta: #fff; --tinta-2: rgba(255,255,255,.72); --tinta-3: rgba(255,255,255,.60);
  --azul: #4361ee; --azul-vivo: #5878ff; --azul-claro: #8ea6ff;
  --t-instante: 90ms; --t-rapido: 240ms; --t-base: 380ms; --t-lento: 760ms; --t-amb: 950ms;
  --e-sai: cubic-bezier(.16, .84, .44, 1);
  --fonte-titulo: "Urbanist", ui-sans-serif, system-ui, sans-serif;
}
@property --giro { syntax: '<angle>'; initial-value: 0deg; inherits: false; }

* { box-sizing: border-box; margin: 0; }
body {
  background: var(--marinho-900); color: var(--tinta); min-height: 100dvh;
  font: 15px/1.6 "Lexend", ui-sans-serif, system-ui, sans-serif;
  display: grid; place-items: center; padding: 24px 20px 40px;
  -webkit-font-smoothing: antialiased;
}
/* a grade fina do tabuleiro, igual à do herói do site */
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,.038) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,.038) 1px, transparent 1px);
  background-size: 84px 84px;
  -webkit-mask-image: radial-gradient(ellipse 72% 58% at 50% 38%, #000 28%, transparent 76%);
          mask-image: radial-gradient(ellipse 72% 58% at 50% 38%, #000 28%, transparent 76%);
}
/* o brilho do navy da logo */
body::after {
  content: ""; position: fixed; z-index: 0; pointer-events: none;
  left: 50%; top: -22rem; width: 40rem; height: 40rem; translate: -50% 0;
  border-radius: 50%; background: rgba(22, 37, 95, .5); filter: blur(120px);
}

.envelope { position: relative; z-index: 1; width: 100%; max-width: 452px; }

.caixa {
  position: relative; isolation: isolate;
  background: var(--grafite-900); border: 1px solid var(--borda);
  border-radius: 18px; padding: 40px 34px 30px;
  animation: entrar var(--t-lento) var(--e-sai) backwards;
}
/* a mesma luz que corre a borda dos cartões do site */
.caixa::before {
  content: ""; position: absolute; inset: -1px; border-radius: inherit;
  padding: 1.5px; pointer-events: none; z-index: -1;
  background: conic-gradient(from var(--giro),
              transparent 0 74%, rgba(142,166,255,.28) 81%,
              #dfe6ff 88%, rgba(142,166,255,.28) 95%, transparent 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
          mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  animation: correr-borda 6s linear infinite;
}
@keyframes correr-borda { to { --giro: 360deg; } }
@keyframes entrar { from { opacity: 0; translate: 0 16px; } }
@keyframes surgir { from { opacity: 0; translate: 0 8px; } }

.marca { display: flex; align-items: center; gap: 11px; margin-bottom: 26px; }
.marca svg { height: 36px; color: var(--tinta); flex: none; }
.marca b { font-family: var(--fonte-titulo); font-size: 15px; font-weight: 800; letter-spacing: -.01em; display: block; }
.marca b span { color: var(--azul-claro); }
.marca small { display: block; font-size: 10.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--tinta-3); margin-top: 2px; }

h1 { font-family: var(--fonte-titulo); font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1.12; }
.sub { color: var(--tinta-2); margin-top: 9px; font-size: 14.5px; }

form { margin-top: 26px; }
.campo { margin-bottom: 15px; animation: surgir var(--t-lento) var(--e-sai) backwards; }
.campo:nth-of-type(1) { animation-delay: 90ms; }
.campo:nth-of-type(2) { animation-delay: 160ms; }
label {
  display: block; font-family: var(--fonte-titulo); font-size: 11px; font-weight: 800;
  text-transform: uppercase; letter-spacing: .14em; color: var(--azul-claro); margin-bottom: 8px;
}
.entrada { position: relative; }
input {
  width: 100%; background: var(--marinho-900); color: var(--tinta);
  border: 1px solid var(--borda); border-radius: 11px; padding: 14px 15px;
  font: 400 15px/1.4 "Lexend", ui-sans-serif, system-ui, sans-serif;
  transition: border-color var(--t-rapido) ease, background var(--t-rapido) ease;
}
input:hover { border-color: rgba(255,255,255,.18); }
input:focus { outline: 2px solid var(--azul-claro); outline-offset: 2px; border-color: transparent; background: var(--grafite-800); }
input::placeholder { color: rgba(255,255,255,.32); }
input[type=password] { padding-right: 52px; }
.ver-senha {
  position: absolute; right: 6px; top: 50%; translate: 0 -50%;
  background: none; border: 0; cursor: pointer; padding: 9px 10px; border-radius: 8px;
  color: var(--tinta-3); display: grid; place-items: center;
  transition: color var(--t-rapido) ease, background var(--t-rapido) ease;
}
.ver-senha:hover { color: var(--tinta); background: rgba(255,255,255,.06); }
.ver-senha:focus-visible { outline: 2px solid var(--azul-claro); outline-offset: 2px; }
.ver-senha svg { width: 19px; height: 19px; grid-area: 1 / 1; }
/* o [hidden] do HTML precisa ser reafirmado: dentro de um grid os dois
   ícones ocupavam a mesma célula e apareciam empilhados */
.ver-senha svg[hidden] { display: none; }

.btn {
  width: 100%; margin-top: 10px; border: 0; cursor: pointer;
  background: var(--azul); color: #fff; border-radius: 12px; padding: 15px 20px;
  font: 600 15px "Lexend", ui-sans-serif, system-ui, sans-serif;
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  box-shadow: 0 18px 45px -18px rgba(67,97,238,.75);
  transition: background var(--t-rapido) ease, box-shadow var(--t-rapido) ease, transform var(--t-rapido) var(--e-sai);
  animation: surgir var(--t-lento) var(--e-sai) 230ms backwards;
}
.btn:hover { background: var(--azul-vivo); box-shadow: 0 22px 55px -18px rgba(67,97,238,.95); }
.btn:active { transform: scale(.985); transition-duration: var(--t-instante); }
.btn:focus-visible { outline: 2px solid var(--azul-claro); outline-offset: 3px; }
.btn[disabled] { opacity: .6; cursor: progress; }
.btn svg { width: 17px; height: 17px; flex: none; }

/* rodinha de espera enquanto o servidor responde */
.girando { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: girar .7s linear infinite; }
@keyframes girar { to { rotate: 360deg; } }

.aviso {
  margin-top: 14px; font-size: 13.5px; border-radius: 10px; padding: 11px 13px;
  animation: surgir var(--t-base) var(--e-sai);
}
.aviso.ruim { color: #ffb9b9; background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.34); }
.aviso.neutro { color: var(--tinta-2); background: rgba(255,255,255,.04); border: 1px solid var(--borda); }
.aviso a { color: var(--azul-claro); }

.rodape-caixa { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--borda); font-size: 13.5px; color: var(--tinta-3); }
.rodape-caixa a { color: var(--azul-claro); }
.alternativa { background: none; border: 0; padding: 0; font: inherit; color: var(--azul-claro); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.fora { margin-top: 18px; text-align: center; font-size: 12.5px; color: rgba(255,255,255,.4); }
.fora a { color: rgba(255,255,255,.58); }

#bloco-link { display: none; }
#bloco-link.mostrar { display: block; }

@media (max-width: 420px) { .caixa { padding: 32px 22px 26px; } h1 { font-size: 24px; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  .caixa::before { animation: none !important; opacity: .35; }
  .btn:hover, .btn:active { transform: none !important; }
}
</style>
</head>

-46.8,89.3-2,183.9,6.7,205.5 c13.9,34.6,36.4,63.5,68.9,82.9c23.7,14.2,49,19.6,77.8,8.3c-1.6-6.6-5.2-18.1-14.6-29.1c-5.4-6.3-11-10.6-15.4-13.4 c-10.2-1.9-26.2-6.4-42-17.8c-20.1-14.5-29-32.6-39.3-53.6c-13.7-27.7-18.6-51.6-20.4-61.9c-5.3-30.8-3.2-57.2,0-75.8 c18.1,44.1,42.9,55.3,52.2,58.6c25.9,9.1,65.1,5.1,81.4,0.7c30.4-8.3,55.6,2.3,77.4,22.9c9.9,9.4,19,19.7,27.5,28.7 C737.3,543,765.2,510.3,755,454.8z"/></svg>

  <h1>Entrar no seu portal</h1>

<script>
(function () {
  'use strict';

  var CHAVE_TOKEN = 'cavalcante:portal:token';
  var CHAVE_LINK  = 'cavalcante:portal:link';
  var CHAVE_DADOS = 'cavalcante:portal:dados';

  var form   = document.getElementById('form-login');
  var email  = document.getElementById('campo-email');
  var senha  = document.getElementById('campo-senha');
  var btn    = document.getElementById('btn-entrar');
  var rotulo = document.getElementById('rotulo-btn');
  var seta   = document.getElementById('seta-btn');
  var erro   = document.getElementById('erro');
  var blocoLink = document.getElementById('bloco-link');

  function guardar(chave, valor) { try { localStorage.setItem(chave, valor); } catch (e) { /* aba anônima */ } }
  function ler(chave) { try { return localStorage.getItem(chave); } catch (e) { return null; } }

  function mostrarErro(msg, comLink) {
    erro.innerHTML = msg + (comLink
      ? ' <a href="https://wa.me/5584999492725?text=Ol%C3%A1%21%20Preciso%20de%20acesso%20ao%20portal.">Falar com a agência</a>.'
      : '');
    erro.hidden = false;
  }

  function ocupado(sim) {
    btn.disabled = sim;
    rotulo.textContent = sim ? 'Entrando…' : 'Entrar no portal';
    seta.hidden = sim;
    var roda = document.getElementById('roda');
    if (sim && !roda) {
      roda = document.createElement('span');
      roda.id = 'roda'; roda.className = 'girando';
      btn.appendChild(roda);
    } else if (!sim && roda) { roda.remove(); }
  }

  /* Entra de fato: guarda os dados nesta aba e entrega ao portal do app.
     sessionStorage e não a URL porque os dados do cliente não têm por que
     ficar no histórico do navegador nem em log de servidor nenhum. */
  function abrirPortal(resposta) {
    try { sessionStorage.setItem(CHAVE_DADOS, JSON.stringify(resposta.dados)); }
    catch (e) { mostrarErro('Seu navegador está bloqueando o armazenamento. Libere os dados de site e tente de novo.'); return; }
    location.replace('../app/index.html#/p?sessao');
  }

  function pedir(corpo) {
    var parar = null;
    var controle = typeof AbortController !== 'undefined' ? new AbortController() : null;
    if (controle) parar = setTimeout(function () { controle.abort(); }, 20000);
    return fetch('/api/portal/entrar', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(corpo),
      signal: controle ? controle.signal : undefined
    }).then(function (r) {
      if (parar) clearTimeout(parar);
      return r.json().then(function (j) { return { status: r.status, corpo: j }; });
    }, function (e) {
      if (parar) clearTimeout(parar);
      throw e;
    });
  }

  function mostrarBlocoLink() { blocoLink.classList.add('mostrar'); }

  /* ---------- volta automática: o aparelho já entrou antes ---------- */
  var token = ler(CHAVE_TOKEN);
  if (token) {
    ocupado(true);
    pedir({ token: token }).then(function (r) {
      if (r.status === 200) { abrirPortal(r.corpo); return; }
      try { localStorage.removeItem(CHAVE_TOKEN); } catch (e) {}
      ocupado(false);
    }).catch(function () { ocupado(false); });
  }

  /* ---------- entrar com e-mail e senha ---------- */
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    erro.hidden = true;
    var e = email.value.trim(), s = senha.value;
    if (!e || e.indexOf('@') < 1) { mostrarErro('Digite o seu e-mail completo.'); email.focus(); return; }
    if (!s) { mostrarErro('Digite a sua senha.'); senha.focus(); return; }

    ocupado(true);
    pedir({ email: e, senha: s }).then(function (r) {
      ocupado(false);
      if (r.status === 200) {
        guardar(CHAVE_TOKEN, r.corpo.token);
        abrirPortal(r.corpo);
        return;
      }
      if (r.corpo && r.corpo.codigo === 'NAO_CONFIGURADO') {
        mostrarErro('O login por e-mail ainda não foi ativado. Use o link de acesso abaixo, ou fale com a agência.');
        mostrarBlocoLink();
        return;
      }
      mostrarErro((r.corpo && r.corpo.erro) || 'Não consegui entrar agora.', r.status === 401);
      senha.select();
    }).catch(function (err) {
      ocupado(false);
      if (err && err.name === 'AbortError') mostrarErro('O servidor demorou demais para responder. Tente de novo.');
      else mostrarErro('Sem conexão com a internet — verifique a rede e tente de novo.');
    });
  });

  /* ---------- mostrar/esconder a senha ---------- */
  var btnVer = document.getElementById('btn-ver');
  var olhoAberto = document.getElementById('olho-aberto');
  var olhoFechado = document.getElementById('olho-fechado');
  btnVer.addEventListener('click', function () {
    var vendo = senha.type === 'text';
    senha.type = vendo ? 'password' : 'text';
    olhoAberto.hidden = !vendo;
    olhoFechado.hidden = vendo;
    btnVer.setAttribute('aria-pressed', String(!vendo));
    btnVer.setAttribute('aria-label', vendo ? 'Mostrar a senha' : 'Esconder a senha');
    senha.focus();
  });

  /* ---------- caminho do link exclusivo ---------- */
  document.getElementById('btn-alternar').addEventListener('click', function () {
    mostrarBlocoLink();
    document.getElementById('campo-link').focus();
  });

  function entrarPorLink() {
    var campo = document.getElementById('campo-link');
    var m = String(campo.value || '').match(/#\/p\?d=([A-Za-z0-9._~%-]+)/);
    if (!m) { mostrarErro('Esse link não parece o do portal. Ele tem "#/p?d=" no meio — cole o endereço inteiro.'); campo.focus(); return; }
    guardar(CHAVE_LINK, m[1]);
    location.replace('../app/index.html#/p?d=' + m[1]);
  }
  document.getElementById('btn-link').addEventListener('click', entrarPorLink);
  document.getElementById('campo-link').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); entrarPorLink(); }
  });

  /* quem entrou por link antes continua entrando por ele */
  var linkSalvo = ler(CHAVE_LINK);
  if (!token && linkSalvo) { location.replace('../app/index.html#/p?d=' + linkSalvo); }

  if (!token) email.focus();
})();
</script>
